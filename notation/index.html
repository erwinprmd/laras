<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Music Notation — LARAS</title>

    <meta
        name="description"
        content="LARAS Music Notation — digital music notation workspace."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="notation-header">

        <div class="notation-brand">

            <a href="../">
                LARAS
            </a>

            <span>/</span>

            <span>Music Notation</span>

        </div>

        <a
            href="../"
            class="back-link"
        >
            Back to LARAS
        </a>

    </header>


    <main class="notation-workspace">

        <section class="workspace-intro">

            <p class="eyebrow">
                MUSIC NOTATION
            </p>

            <h1>
                Write music.
            </h1>

            <p>
                A simple workspace for creating
                and exploring musical notation.
            </p>

        </section>


        <section class="notation-editor">

            <div class="editor-toolbar">

                <button type="button">
                    Treble Clef
                </button>

                <button type="button">
                    4/4
                </button>

                <button type="button" data-duration="quarter">
    ♩
</button>

<button type="button" data-duration="eighth">
    ♪
</button>

<button type="button" data-duration="eighth-pair">
    ♫
</button>

            </div>


            <div class="staff-area">

                <div class="staff">

                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            LARAS — Music Technology
        </p>

    </footer>

    <script src="notation.js"></script>
</body>

</html>
